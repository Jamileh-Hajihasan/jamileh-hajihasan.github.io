title: "Jamileh Hajihasan"

subtitle: "Textile Artist"

content: |
  Jamileh Hajihasan is a skilled artisan and professional educator with deep expertise in Persian carpet and kilim weaving.
  Since 2016, she has taught this traditional art in both Iran and Canada.
  In Toronto and Montreal, she has led numerous private and group workshops in collaboration with cultural and community organizations,
  including the Willowdale City Office, Gibson House Museum, Tirgan Festival, and Sukoon Space.

  She is also the author of a bilingual (Persian–English) handbook introducing the fundamentals of carpet weaving.
  Beyond artistic practice, her work emphasizes the therapeutic and mental health benefits of traditional hand-weaving.

