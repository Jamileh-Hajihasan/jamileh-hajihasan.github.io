<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ .Title }}</title>

  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .topbar { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .topbar a { text-decoration: none; }
    h1 { margin: 0; font-size: 28px; }
    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 22px; align-items: start; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }

    .slider { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.10); }
    .slide { display: none; width: 100%; height: auto; }
    .slide.active { display: block; }
    .controls { display: flex; gap: 10px; margin-top: 10px; }
    .btn { padding: 10px 14px; border: 1px solid rgba(0,0,0,.15); border-radius: 10px; background: white; cursor: pointer; }
    .btn:hover { background: rgba(0,0,0,.03); }

    .text { line-height: 1.6; font-size: 16px; }
    .muted { opacity: .75; font-size: 14px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="btn" href="/">← Home</a>
      <div>
        <h1>{{ .Title }}</h1>
        <div class="muted">Toranj Art Workshops • Toronto</div>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="slider" id="slider">
          {{ $imgs := .Params.images }}
          {{ if $imgs }}
            {{ range $i, $src := $imgs }}
              <img class="slide {{ if eq $i 0 }}active{{ end }}" src="{{ $src | relURL }}" alt="Workshop photo {{ add $i 1 }}">
            {{ end }}
          {{ else }}
            <img class="slide active" src="{{ "images/collaborations.jpg" | relURL }}" alt="Workshop photo placeholder">
          {{ end }}
        </div>

        <div class="controls">
          <button class="btn" id="prev">Prev</button>
          <button class="btn" id="next">Next</button>
        </div>
      </div>

      <div class="text">
        {{ .Content }}
      </div>
    </div>
  </div>

  <script>
    (function () {
      const slides = Array.from(document.querySelectorAll(".slide"));
      if (slides.length <= 1) return;

      let idx = 0;
      const show = (i) => {
        slides[idx].classList.remove("active");
        idx = (i + slides.length) % slides.length;
        slides[idx].classList.add("active");
      };

      document.getElementById("prev").addEventListener("click", () => show(idx - 1));
      document.getElementById("next").addEventListener("click", () => show(idx + 1));

      // Auto-advance every 5 seconds
      setInterval(() => show(idx + 1), 5000);
    })();
  </script>
</body>
</html>
